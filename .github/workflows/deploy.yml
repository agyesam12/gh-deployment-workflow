name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
  workflow_dispatch:


permissions:
  contents: read    
  pages: write      
  id-token: write   


concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      # Copy only the website into a folder, so README/workflows aren't published
      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Upload site as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Job 2 (CD): publish the artifact to GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4